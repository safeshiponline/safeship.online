<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 252" fill="none">
  <defs>
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="36" y1="68" x2="236" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="topPlate" x1="40" y1="54" x2="230" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gripGrad" x1="36" y1="76" x2="82" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mountRing" x1="95" y1="88" x2="205" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="outerBarrel" x1="96" y1="90" x2="204" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="45%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="28%" stop-color="#0284C7" stop-opacity="0.75"/>
      <stop offset="62%" stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glare" x1="118" y1="112" x2="165" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Soft floor shadow matching other preset cutouts -->
  <ellipse cx="138" cy="222" rx="88" ry="12" fill="url(#dropShadow)"/>

  <!-- Top EVF / Prism Housing -->
  <path d="M106 46C108.5 40.5 113.5 37 120 37H168C174.5 37 179.5 40.5 182 46L190 66H98L106 46Z" fill="url(#topPlate)" stroke="#475569" stroke-width="1.2"/>
  <!-- Hotshoe metallic mount -->
  <rect x="126" y="32" width="36" height="5" rx="1.5" fill="#94A3B8"/>
  <rect x="131" y="34" width="26" height="3" rx="1" fill="#334155"/>

  <!-- Control Dials on Top Right & Left -->
  <rect x="60" y="53" width="24" height="13" rx="3" fill="#334155" stroke="#64748B" stroke-width="1"/>
  <rect x="196" y="51" width="26" height="15" rx="3.5" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <rect x="50" y="57" width="12" height="9" rx="2.5" fill="#EA580C"/>

  <!-- Main Mirrorless Camera Body -->
  <rect x="38" y="64" width="198" height="142" rx="18" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- Top Bevel Highlight -->
  <path d="M56 65.5H218C226.5 65.5 234 72 234.5 80V83H39.5V80C40 72 47.5 65.5 56 65.5Z" fill="url(#topPlate)" opacity="0.75"/>

  <!-- Ergonomic Right-Hand Grip (Left side from front view) -->
  <path d="M38 82C38 73 45 66 54 66H74C78 66 81 69 81 73V199C81 203 78 206 74 206H54C45 206 38 199 38 190V82Z" fill="url(#gripGrad)" stroke="#334155" stroke-width="1"/>

  <!-- Red/Orange Alpha Badge & AF Illuminator -->
  <circle cx="92" cy="86" r="4.5" fill="#EF4444" stroke="#FCA5A5" stroke-width="1"/>
  <text x="206" y="92" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="0.5">α7</text>
  <rect x="206" y="97" width="16" height="3" rx="1.5" fill="#EA580C"/>

  <!-- Cinnamon / Orange Anodized Mount Ring -->
  <circle cx="150" cy="140" r="59" fill="url(#mountRing)"/>

  <!-- Outer Metallic Lens Barrel -->
  <circle cx="150" cy="140" r="55" fill="url(#outerBarrel)" stroke="#64748B" stroke-width="1.5"/>

  <!-- Ribbed Focus Ring Texture -->
  <circle cx="150" cy="140" r="48" fill="#0F172A" stroke="#334155" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Inner Lens Frame -->
  <circle cx="150" cy="140" r="41" fill="#090D16" stroke="#475569" stroke-width="1.2"/>

  <!-- Multi-Coated Optical Glass Element -->
  <circle cx="150" cy="140" r="34" fill="url(#lensGlass)"/>

  <!-- Inner Aperture Blades Ring -->
  <circle cx="150" cy="140" r="18" fill="#020617" fill-opacity="0.55" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Specular Lens Coating Reflections -->
  <ellipse cx="136" cy="125" rx="14" ry="8" transform="rotate(-28 136 125)" fill="url(#glare)"/>
  <circle cx="164" cy="154" r="5" fill="#38BDF8" fill-opacity="0.35"/>
  <circle cx="158" cy="148" r="2.2" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>
